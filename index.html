<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card" id="authSection">
      <h1>Digital Notes</h1>
      <p class="subtitle">Crea tu cuenta o inicia sesión para guardar tus notas personales.</p>

      <div class="tab-buttons" role="tablist" aria-label="Acceso">
        <button class="tab-btn active" id="showRegisterBtn" type="button">Registro</button>
        <button class="tab-btn" id="showLoginBtn" type="button">Login</button>
      </div>

      <form id="registerForm" class="form active" autocomplete="on">
        <label for="registerName">Nombre</label>
        <input id="registerName" type="text" placeholder="Tu nombre" required />

        <label for="registerAge">Edad</label>
        <input id="registerAge" type="number" min="1" max="120" placeholder="Tu edad" required />

        <label for="registerEmail">Email</label>
        <input id="registerEmail" type="email" placeholder="correo@ejemplo.com" required />

        <label for="registerPassword">Contraseña</label>
        <input id="registerPassword" type="password" minlength="6" placeholder="Mínimo 6 caracteres" required />

        <button type="submit" class="pink-btn">Crear cuenta</button>
      </form>

      <form id="loginForm" class="form" autocomplete="on">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" placeholder="correo@ejemplo.com" required />

        <label for="loginPassword">Contraseña</label>
        <input id="loginPassword" type="password" minlength="6" placeholder="Tu contraseña" required />

        <button type="submit" class="pink-btn">Iniciar sesión</button>
      </form>

      <p id="authMessage" class="message"></p>
    </section>

    <section class="card notes-card hidden" id="notesSection">
      <div class="notes-header">
        <div>
          <h2>Mis notas</h2>
          <p id="currentUser" class="subtitle"></p>
        </div>
        <button id="logoutBtn" type="button" class="pink-btn">Cerrar sesión</button>
      </div>

      <div class="stats-grid">
        <article class="stat-item">
          <span>Total</span>
          <strong id="totalNotes">0</strong>
        </article>
        <article class="stat-item">
          <span>Destacadas</span>
          <strong id="pinnedNotes">0</strong>
        </article>
        <article class="stat-item">
          <span>Categorías</span>
          <strong id="categoryCount">0</strong>
        </article>
      </div>

      <div class="tools-grid">
        <div>
          <label for="searchInput">Buscar nota</label>
          <input id="searchInput" type="search" placeholder="Busca por título o contenido" />
        </div>
        <div>
          <label for="sortSelect">Ordenar</label>
          <select id="sortSelect">
            <option value="newest">Más recientes</option>
            <option value="oldest">Más antiguas</option>
            <option value="pinned">Destacadas primero</option>
          </select>
        </div>
      </div>

      <form id="noteForm" class="form active">
        <label for="noteTitle">Título</label>
        <input id="noteTitle" type="text" placeholder="Título de la nota" required />

        <label for="noteCategory">Categoría</label>
        <input id="noteCategory" type="text" placeholder="Ej: estudio, trabajo, personal" />

        <label for="noteContent">Contenido</label>
        <textarea id="noteContent" placeholder="Escribe tu nota aquí..." required></textarea>

        <label class="checkbox-label" for="notePinned">
          <input id="notePinned" type="checkbox" />
          Marcar como destacada
        </label>

        <button type="submit" class="pink-btn">Guardar nota</button>
      </form>

      <p id="notesMessage" class="message"></p>
      <ul id="notesList" class="notes-list"></ul>
    </section>
  </main>

  <script type="module" src="firebase-notes.js"></script>
</body>
</html>
